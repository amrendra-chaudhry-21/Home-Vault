name: Production CI/CD (AWS EC2 Free Tier)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. CI Quality Gate: Lint, Build, & Integration Tests
  # ============================================================================
  test-and-verify:
    name: Run Automated Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify TypeScript Compilation
        working-directory: ./backend
        run: npm run build

      - name: Start MongoDB Test Container
        run: |
          docker run -d --name test-mongo -p 27017:27017 mongo:7.0
          echo "Waiting for MongoDB test container to be ready..."
          for i in {1..30}; do
            if docker exec test-mongo mongosh --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              echo "✅ MongoDB test container is ready and responsive!"
              break
            fi
            sleep 1
          done

      - name: Run Jest Test Suite (Isolated Test DB)
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://127.0.0.1:27017/homevault_ci_test?directConnection=true
          JWT_ACCESS_SECRET: test_ci_jwt_access_secret_super_secure_key_1234
          JWT_REFRESH_SECRET: test_ci_jwt_refresh_secret_super_secure_key_1234
          ACCESS_TOKEN_TTL: 15m
          REFRESH_TOKEN_TTL: 7d
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test

  # ============================================================================
  # 2. Build Docker Image & Deploy to AWS EC2
  # ============================================================================
  build-and-deploy:
    name: Build Container & Deploy to EC2
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag Name
        run: |
          # Convert repository name to lowercase for Docker registry compatibility
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LOWER}-backend:latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS EC2 via Clean Remote Script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          IMAGE_TAG: ${{ env.IMAGE_NAME }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Setup native OpenSSH private key
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. Generate clean deployment script without nested heredoc syntax issues
          cat << 'EOF_SCRIPT' > deploy_remote.sh
          #!/usr/bin/env bash
          set -euo pipefail

          DEPLOY_DIR="$HOME/homevault"
          echo "🚀 Deploying to ${DEPLOY_DIR}..."
          mkdir -p "${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          # Write production .env file
          cat > .env << ENV_VARS
          NODE_ENV=production
          PORT=5001
          MONGODB_URI=${MONGODB_URI}
          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          ACCESS_TOKEN_TTL=15m
          REFRESH_TOKEN_TTL=7d
          CORS_ORIGINS=*
          UPLOAD_STORAGE_DRIVER=local
          LOCAL_UPLOAD_DIR=public/uploads
          TZ=Asia/Kolkata
          IMAGE_NAME=${IMAGE_NAME}
          ENV_VARS

          # Authenticate Docker on EC2 to pull from GHCR
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          # Write production docker-compose.yml
          cat > docker-compose.yml << 'COMPOSE_VARS'
          version: '3.8'
          services:
            backend:
              image: ${IMAGE_NAME}
              container_name: homevault-backend
              restart: unless-stopped
              ports:
                - "5001:5001"
              env_file:
                - .env
              volumes:
                - homevault_uploads:/app/public/uploads
              deploy:
                resources:
                  limits:
                    memory: 512M
              logging:
                driver: "json-file"
                options:
                  max-size: "20m"
                  max-file: "3"
          volumes:
            homevault_uploads:
              name: homevault_uploads
          COMPOSE_VARS

          # Pull latest Docker image & restart container
          echo "📥 Pulling latest Docker image: ${IMAGE_NAME}..."
          docker compose pull backend

          echo "🔄 Restarting container..."
          docker compose up -d --remove-orphans

          # Clean up dangling images to preserve 20GB free disk
          docker image prune -f

          # Verify Healthcheck endpoint
          echo "🩺 Verifying Health Check at http://localhost:5001/health..."
          sleep 8
          HEALTHY=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -sf http://localhost:5001/health | grep -q '"status":"UP"'; then
              echo "=========================================================="
              echo "🎉 SUCCESS: HomeVault Backend is UP & HEALTHY on AWS EC2!"
              echo "=========================================================="
              HEALTHY=1
              break
            fi
            echo "Waiting for backend service to become ready... (Attempt $attempt/8)"
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ ERROR: Health check failed or timed out!"
            docker logs homevault-backend --tail 50
            exit 1
          fi
EOF_SCRIPT

          # 3. Transfer deploy_remote.sh to EC2
          echo "📦 Copying deployment script to EC2..."
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa deploy_remote.sh "${EC2_USER}@${EC2_HOST}:~/deploy_remote.sh"

          # 4. Execute deployment script on EC2 with environment variables passed cleanly
          echo "🚀 Executing deployment script on EC2..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "${EC2_USER}@${EC2_HOST}" \
            "IMAGE_NAME='${IMAGE_TAG}' MONGODB_URI='${MONGODB_URI}' JWT_ACCESS_SECRET='${JWT_ACCESS_SECRET}' JWT_REFRESH_SECRET='${JWT_REFRESH_SECRET}' GITHUB_ACTOR='${GH_ACTOR}' GITHUB_TOKEN='${GH_TOKEN}' bash ~/deploy_remote.sh"
