version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-homevault-backend:latest}
    container_name: homevault-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7d}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - UPLOAD_STORAGE_DRIVER=${UPLOAD_STORAGE_DRIVER:-local}
      - LOCAL_UPLOAD_DIR=public/uploads
      - TZ=Asia/Kolkata
    volumes:
      - backend_uploads:/app/public/uploads
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  backend_uploads:
    name: homevault_uploads
